[package]
name = "elviewer"
version = "0.2.3"
description = "ELviewer - high performance novel reader"
authors = ["ELviewer"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "elviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
chardetng = "1.0.0"
encoding_rs = "0.8.42"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "time"] }
sevenz-rust2 = "0.23.0"
walkdir = "2.5.0"
html-escape = "0.2.15"
rtf-parser = { version = "0.4.3", default-features = false }
unicode-normalization = "0.1.25"
regex = "1.13.1"
# Google Drive downloads reach Rust as base64 on Android (see gdrive_cache_put_chunk)
base64 = "0.22"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Read-aloud (ONNX Runtime) and Google sign-in via the browser are desktop-only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls", "api-23"] }
ndarray = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "http2"] }
# Google Drive sign-in (OAuth for installed apps, PKCE)
sha2 = "0.10"
getrandom = "0.3"
form_urlencoded = "1"
# Remembers the window size / position / maximized state between runs.
tauri-plugin-window-state = "2"
# A second launch (opening a file from Explorer) hands its file to the running window.
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "29"
